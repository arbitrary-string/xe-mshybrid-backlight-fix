# This board's OLED panel supports VESA-standard AUX/DPCD backlight
# control (confirmed directly via DPCD register reads/writes during the
# dGPU-mode OLED brightness work in clevo-control-panel), but the xe
# driver's default (-1, "trust the firmware VBT table") falls back to a
# non-functional legacy PWM backlight instead -- confirmed live: writing
# to /sys/class/backlight/intel_backlight/brightness had zero visible
# effect on the panel.
#
# Update 2026-10-26, value changed from 2 to 3 -- this is the actual fix
# for the whole 2026-10-23/26 MSHybrid backlight saga (see
# oled-mshybrid-backlight.patch's own header and
# project_mshybrid_oled_backlight_kernel_patch.md for the full history).
# `enable_dpcd_backlight` is xe's own built-in module parameter
# (drivers/gpu/drm/i915/display/intel_display_params.c), not something
# from this repo's patch: -1=per-VBT (default), 0=disabled, 1=enable,
# 2=force VESA interface, 3=force Intel's own proprietary interface.
# Value 2 (force VESA) is what got real brightness control working at
# all back in September -- but the VESA interface is the one this
# entire repo's kernel patch has been fighting ever since: this exact
# panel's VESA-mode implementation works fine from a cold boot but does
# not reliably survive a real suspend/resume (confirmed live 2026-10-26:
# DPCD mode-set register and target-luminance register both read back
# *correctly* written post-resume, matching the user's slider in real
# time, panel still visibly unresponsive -- every register checkable
# from the host side says this should work and it doesn't, pointing at
# a TCON-firmware-level limitation in VESA mode specifically, not
# anything fixable via more AUX writes).
#
# Switching to value 3 (force Intel's own proprietary interface,
# intel_dp_hdr_bl_funcs in intel_dp_aux_backlight.c -- a completely
# separate code path from everything oled-mshybrid-backlight.patch
# touches) fixed brightness control on *both* cold boot and after
# suspend/resume, found live by the user, not through more kernel
# patching. Matches this exact comment already sitting upstream in
# intel_dp_aux_init_backlight_funcs(): "Since Intel has their own
# backlight control interface, the majority of machines out there using
# DPCD backlight controls with Intel GPUs will be using this interface
# as opposed to the VESA interface" -- i.e. Intel's own interface is the
# better-supported, more commonly used path specifically on Intel GPUs,
# and this whole investigation had been exclusively fighting the less
# mature one instead. Also per that same upstream comment: "on many
# panels that advertise support for both interfaces, the VESA backlight
# interface will stop working once we've programmed the panel with
# Intel's OUI" -- i.e. these two interfaces are known upstream to be
# mutually exclusive on a panel supporting both, not just two
# independent equally-valid options.
#
# Not yet independently verified: whether value 3 alone, on a fully
# *stock* (unpatched) xe.ko, is sufficient by itself -- the live system
# this was found on still has oled-mshybrid-backlight.patch's custom
# xe.ko loaded at the time this fix was found. Since the Intel-interface
# code path (try_intel_interface branch) is checked *before* the
# VESA-interface branch this repo's patch exclusively touches, and
# value 3 only sets try_intel_interface (not try_vesa_interface), the
# patched VESA-path code this repo adds should never even be reached
# once this value is set -- but that's reasoning from source, not yet
# confirmed by actually testing value 3 against stock xe.ko. Worth
# testing before deciding whether oled-mshybrid-backlight.patch can be
# retired entirely.
options xe enable_dpcd_backlight=3
