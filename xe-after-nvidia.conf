# CONFIRMED WORKING FIX (2026-09-14), replacing the boot-time
# suspend/resume workaround (oled-mshybrid-backlight-fixup.service +
# oled-mshybrid-fixup-wake-arm.sh, both now obsolete -- kept in this
# directory for reference only).
#
# Root cause: xe's boot-time eDP AUX-VESA backlight setup (see
# oled-mshybrid-backlight.patch) never actually enables real
# DPCD-controlled backlight mode when NVIDIA is also loaded
# (`prime-select on-demand`) -- confirmed live this never happens in
# `prime-select intel` (NVIDIA fully unloaded), and confirmed via
# kernel function tracing that `intel_dp_aux_vesa_enable_backlight`
# genuinely never gets called at cold boot in on-demand mode (not
# called-and-failing -- skipped entirely by xe's own atomic-check
# logic), while `intel_dp_aux_vesa_set_backlight` (the plain value
# write) runs fine but has no visible effect, since the panel's control
# mode was never actually switched from legacy PWM. `on-demand` mode
# uniquely creates a second DRM connector, card1-eDP-2, owned by
# nvidia_drm, for the same physical panel xe (card0-eDP-1) exclusively
# drives in MSHybrid mode -- confirmed live this is what's actually
# responsible: giving xe a real head start before nvidia_drm loads and
# registers that competing connector fixes the bug completely, with no
# suspend/resume needed at all.
#
# How this was narrowed down (in order, so a future regression doesn't
# have to redo this from scratch):
#   1. softdep xe pre: nvidia_drm -- forced nvidia_drm to insert first.
#      Didn't fix it. dmesg showed nvidia-drm's own "Initialized
#      nvidia-drm" landing only ~314ms before xe started regardless --
#      module *insertion* order isn't the same as nvidia's own async
#      hardware/connector-detection settling.
#   2. Same softdep, plus a real 5s wall-clock delay via an `install`
#      override on nvidia_drm (softdep's `pre:` makes xe's own modprobe
#      synchronously invoke `modprobe nvidia_drm` and wait for it, so
#      overriding that call to sleep afterward delays xe's own load by
#      the same amount). Still didn't fix it -- nvidia_drm loading and
#      settling *first* just isn't the right direction.
#   3. Reversed: force xe to load first, nvidia_drm after. This is that
#      config. Confirmed live across 4 consecutive boots (2 full
#      shutdown+power-on cycles, 2 warm reboots) -- brightness slider
#      worked immediately on login every time, no suspend/resume
#      involved, visually confirmed (quiet/splash off) that Intel's own
#      backlight control visibly takes over the panel during boot.
#
# Interesting wrinkle confirmed via dmesg timestamps: xe still starts
# probing at its own normal early time regardless of this rule (it
# loads via its own independent udev trigger for the Intel PCI device,
# not through nvidia_drm's softdep chain) -- what this rule actually
# delays is nvidia_drm.ko's own insertion, pushed out to several seconds
# after xe starts. The practical effect is what matters: nvidia_drm's
# own connector registration ends up happening well after xe has had
# time to complete its atomic modeset and successfully call
# intel_dp_aux_vesa_enable_backlight.
#
# Update 2026-10-23, reverted: briefly replaced the `sleep 5` below with
# a kernel-function-tracing wait script
# (xe-wait-for-backlight-enable.sh, kept in this repo for reference),
# on the mistaken theory that a newer NVIDIA driver (615.71.09, up from
# 595.99.02) had made nvidia_drm initialize fast enough that 5 seconds
# stopped being enough margin. That script lived under
# /usr/local/sbin, and broke cold-boot brightness completely -- not
# because the margin was wrong, but because of something more
# fundamental: this whole softdep/install chain fires from *inside
# dracut's initramfs*, before the real root filesystem is ever
# reachable (confirmed directly: `xe.ko` is itself embedded in the
# initrd for early-KMS/flicker-free splash, and the "install" command
# actually executes there, in an environment where `/usr/local` simply
# doesn't exist -- confirmed via `journalctl`: "sh: 1:
# /usr/local/sbin/xe-wait-for-backlight-enable.sh: not found"). `sleep`
# is a basic coreutils binary dracut always bundles into the initrd, so
# it has always worked from this exact spot; nothing under /usr/local
# ever will. This also means the NVIDIA-driver-speed theory above was
# never actually the right explanation -- the real regression that
# week was a completely separate, independently-discovered bug: xe.ko
# simply hadn't been rebuilt with oled-mshybrid-backlight.patch for the
# newly-installed 7.0.0-38-generic kernel at all (see
# rebuild-and-install.sh's own history). Restored the plain, proven
# `sleep 5` below unchanged.
softdep nvidia_drm pre: xe
install xe /sbin/modprobe --ignore-install xe && sleep 5
